name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./pulso
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Regenerate Android structure
        run: |
          rm -rf android
          flutter create --org com.pulso --project-name pulso --platforms android .

      - name: Enable core library desugaring
        run: |
          # Insert desugaring config with correct Kotlin DSL syntax
          python3 - << 'PY'
          import re
          path = "android/app/build.gradle.kts"
          with open(path) as f:
              content = f.read()
          # Add compileOptions inside android block
          desugar = """
              compileOptions {
                  isCoreLibraryDesugaringEnabled = true
                  sourceCompatibility = JavaVersion.VERSION_1_8
                  targetCompatibility = JavaVersion.VERSION_1_8
              }
          """
          if "compileOptions" not in content:
              content = content.replace("android {", "android {" + desugar, 1)
          # Add dependency
          if "coreLibraryDesugaring" not in content:
              content += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")\n}\n'
          with open(path, "w") as f:
              f.write(content)
          print("Desugaring enabled")
          PY

      - name: Restore custom AndroidManifest permissions
        run: |
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.RECORD_AUDIO"/>' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"/>' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>' android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pulso-apk
          path: pulso/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
