name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./pulso
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Regenerate Android structure
        run: |
          rm -rf android
          flutter create --org com.pulso --project-name pulso --platforms android .

      - name: Restore PNG icons
        run: |
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          mkdir -p android/app/src/main/res/values
          python3 - << 'PY'
from PIL import Image, ImageDraw
import os
def make_icon(size, path):
    img = Image.new('RGBA', (size, size), (44, 62, 53, 255))
    draw = ImageDraw.Draw(img)
    m = int(size * 0.33)
    draw.rectangle([m, m, size-m, size-m], fill=(210, 125, 94, 255))
    i = int(size * 0.44)
    draw.rectangle([i, i, size-i, size-i], fill=(255, 255, 255, 255))
    os.makedirs(os.path.dirname(path), exist_ok=True)
    img.save(path)
base = "android/app/src/main/res"
make_icon(48, f"{base}/mipmap-mdpi/ic_launcher.png")
make_icon(72, f"{base}/mipmap-hdpi/ic_launcher.png")
make_icon(96, f"{base}/mipmap-xhdpi/ic_launcher.png")
make_icon(144, f"{base}/mipmap-xxhdpi/ic_launcher.png")
make_icon(192, f"{base}/mipmap-xxxhdpi/ic_launcher.png")
print("Icons generated")
PY
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml << 'ADAPT'
<?xml version="1.0" encoding="utf-8"?>
<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
    <background android:drawable="@color/ic_launcher_background"/>
    <foreground android:drawable="@mipmap/ic_launcher"/>
</adaptive-icon>
ADAPT
          echo '<?xml version="1.0" encoding="utf-8"?><resources><color name="ic_launcher_background">#2C3E35</color></resources>' > android/app/src/main/res/values/ic_launcher_background.xml

      - name: Remove notification dependencies
        run: |
          sed -i '/flutter_local_notifications/d' pubspec.yaml
          sed -i '/timezone/d' pubspec.yaml
          rm -f lib/services/notification_service.dart
          sed -i '/notification_service/d' lib/main.dart
          sed -i '/NotificationService/d' lib/main.dart

      - name: Restore permissions
        run: |
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.RECORD_AUDIO"/>' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"/>' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>' android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        run: flutter pub get

      - name: Static analysis
        run: dart analyze || true

      - name: Tests
        run: flutter test || true

      - name: Build APK
        run: flutter build apk --debug --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pulso-apk
          path: pulso/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
