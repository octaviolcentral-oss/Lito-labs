name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./pulso
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK with verbose
        run: flutter build apk --debug --verbose --android-skip-build-dependency-validation 2>&1 | tee build.log || true

      - name: Show error
        run: |
          echo "=== LAST 100 LINES ==="
          tail -100 build.log || echo "No log"
          echo "=== ERROR LINES ==="
          grep -i "error\|failed\|exception" build.log || echo "No errors found"

      - name: Upload log
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: pulso/build.log
          if-no-files-found: warn
