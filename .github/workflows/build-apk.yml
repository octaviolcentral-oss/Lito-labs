name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./pulso
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: dart analyze || true

      - name: Build APK
        run: flutter build apk --debug --android-skip-build-dependency-validation || true

      - name: Show build output
        run: |
          echo "Build directory contents:"
          ls -la build/app/outputs/flutter-apk/ || echo "No apk dir"
          find build -name "*.apk" || echo "No apk found"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pulso-apk
          path: pulso/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn
          retention-days: 14
