name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./pulso
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Regenerate Android structure
        run: |
          rm -rf android
          flutter create --org com.pulso --project-name pulso --platforms android .

      - name: Restore icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/drawable/ic_launcher_foreground.xml << 'ICON'
<?xml version="1.0" encoding="utf-8"?>
<vector xmlns:android="http://schemas.android.com/apk/res/android"
    android:width="108dp"
    android:height="108dp"
    android:viewportWidth="108"
    android:viewportHeight="108">
    <path android:fillColor="#2C3E35" android:pathData="M0,0h108v108h-108z"/>
    <path android:fillColor="#D27D5E" android:pathData="M36,36 L72,36 L72,72 L36,72 Z"/>
    <path android:fillColor="#FFFFFF" android:pathData="M48,48 L60,48 L60,60 L48,60 Z"/>
</vector>
ICON
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml << 'ADAPT'
<?xml version="1.0" encoding="utf-8"?>
<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
    <background android:drawable="@color/ic_launcher_background"/>
    <foreground android:drawable="@drawable/ic_launcher_foreground"/>
</adaptive-icon>
ADAPT
          echo '<?xml version="1.0" encoding="utf-8"?><resources><color name="ic_launcher_background">#2C3E35</color></resources>' > android/app/src/main/res/values/ic_launcher_background.xml

      - name: Remove notification dependencies
        run: |
          sed -i '/flutter_local_notifications/d' pubspec.yaml
          sed -i '/timezone/d' pubspec.yaml
          rm -f lib/services/notification_service.dart
          sed -i '/notification_service/d' lib/main.dart
          sed -i '/NotificationService/d' lib/main.dart

      - name: Restore permissions
        run: |
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.RECORD_AUDIO"/>' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"/>' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>' android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pulso-apk
          path: pulso/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
