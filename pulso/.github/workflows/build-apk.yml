name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - run: flutter pub get
        working-directory: ./pulso
      - run: flutter build apk --release
        working-directory: ./pulso
      - uses: actions/upload-artifact@v4
        with:
          name: pulso-apk
          path: pulso/build/app/outputs/flutter-apk/app-release.apk
